name: QA Loops Project - Java 23 Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Zulu JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "23"

      - name: Verify Java version
        run: java -version

      - name: Build project with Maven (compile + run tests)
        run: mvn clean install
